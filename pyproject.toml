# Implements: ci/simple-code, tooling/one-command-each, ci/ci-minutes
[project]
name = "treasure-island"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests", ".github/scripts"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
