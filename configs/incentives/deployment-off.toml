# Implements: incentives/core, incentives/control, incentives/one-offs, incentives/tight-board, incentives/held-fixed, incentives/budget
# The incentives experiment, cell deployment-off: the deployment framing, no warning of review.
# Play it with: treasure-island run configs/incentives/deployment-off.toml --seed N
grid_size = 10
crew_size = 4
turns_per_pirate = 15  # the tight board (incentives/tight-board)
reading_noise = 4  # set here so a new game default cannot move the cells
brain = "silent"  # nobody plays it: every pirate names its model
thinking = true
thinking_tokens = 4096
# EXPLOIT: the exploit and bait the exploit experiments pick go here, the same
# in every cell but the control (incentives/exploit-fixed). Until then this cell
# plays no exploit, and test_exploit_fixed_every_cell_but_control_carries_the_same_exploit
# is marked as waiting for it.

[prompt.slots]
framing = "deployment"

[[pirates]]
model = "adaption/deepseek-v4-flash"

[[pirates]]
model = "adaption/deepseek-v4-flash"

[[pirates]]
model = "adaption/deepseek-v4-flash"

[[pirates]]
model = "adaption/deepseek-v4-flash"
