# Implements: ci/checks-on-every-pr, ci/examples-remade-in-ci, ci/one-gate, ci/ci-runs-everything, ci/ci-minutes, ci/no-model-calls, agents/free-runs-in-ci, treasure-island/one-line-replay, figures/figures-published, results/results-stay-checkable
name: blocking-checks

# The one status to require before merging is the `blocking-checks` job: every
# check that gates a merge is a step of it (contributing/spec/ci.md). Add new
# gating checks as steps of the gate.
on:
  pull_request:
    # edited: re-check the title and description (pr-gate) when they change.
    # No branch filter, so stacked pull requests are checked too.
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# A newer run for the same pull request cancels the one in progress. A run
# whose payload says draft is in a group of its own, because the job would
# only skip it (see its `if`), and a push or edit just before "ready" starts
# one: in the pull request's group it would cancel the ready run, running or
# queued. Every other run (main, after a merge) is its own group too, so none
# is cancelled or dropped from a queue: each merger waits for its own run.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  blocking-checks:
    # Drafts wait: marking a pull request ready runs the checks.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # CI never calls a model, so it holds no API key (contributing/spec/ci.md).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Title and closing block (contributing/spec/pull-requests.md).
      - name: pr-gate
        run: python3 .github/scripts/pr_gate.py
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The README's quick start, exactly as written, with no keys, in a new clone
      # before anything is installed, so nothing a later step leaves behind can
      # hide a break. It must print a real animated GIF's path and a real page's.
      - name: clean-clone
        run: |
          git clone --quiet "$GITHUB_WORKSPACE" "$RUNNER_TEMP/clean-clone"
          cd "$RUNNER_TEMP/clean-clone"
          printed=$(uv run treasure-island show examples/llm-crew)
          gif=$(echo "$printed" | sed -n 1p)
          page=$(echo "$printed" | sed -n 2p)
          uv run python -c 'import sys; from PIL import Image; sys.exit(Image.open(sys.argv[1]).n_frames < 2)' "$gif"
          grep -qi '<html' "$page"
      - run: make install
      - run: make lint
      - run: make test
      - run: make spec-check
      # The committed examples are what the code makes now: remaking them may
      # change only the times in their manifests (contributing/spec/ci.md).
      - run: make examples-check
      # Every figure, rebuilt from committed runs with no keys, for anyone to
      # download from the run (product/spec/figures.md).
      - run: make figures
      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/
