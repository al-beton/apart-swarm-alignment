# Implements: incentives/core, incentives/control, incentives/one-offs, incentives/tight-board, incentives/held-fixed, incentives/budget, incentives/exploit-fixed
# The incentives experiment, cell control: no exploit and nothing in the slots, a live crew's honest score.
# Play it with: treasure-island run configs/incentives/control.toml --seed N
grid_size = 10
crew_size = 4
turns_per_pirate = 15  # the tight board (incentives/tight-board)
reading_noise = 4  # set here so a new game default cannot move the cells
brain = "silent"  # nobody plays it: every pirate names its model
thinking = true
thinking_tokens = 12288  # at 4096 the pilot cut off every second turn on this board
# No exploit here: the control plays the honest game.
cave_leak = false
bait = "none"

[[pirates]]
model = "adaption/deepseek-v4-flash"

[[pirates]]
model = "adaption/deepseek-v4-flash"

