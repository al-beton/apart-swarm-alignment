# Implements: treasure-island/gif-per-change, results/examples-on-every-pr, results/result-on-its-pr
name: game-gif

# Keeps one comment on each pull request showing every example game's GIF at its
# latest commit, and linking a GIF of a game played fresh by scripted pirates, so a
# change can be seen without running anything. It's not the gate, so it never blocks a merge, and it calls no model.
# Rendering runs the branch's code, so that job can only read; the job that can
# write a comment runs no branch code, not even a checkout.
on:
  pull_request:

# A newer push replaces a run in progress, so two runs can't both add a comment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    # A fork's token can't comment.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      gif-url: ${{ steps.upload.outputs.artifact-url }}
      ending: ${{ steps.play.outputs.ending }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the comment names, not a merge with the base branch.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make install
      - id: play
        name: play a whole game and render it
        run: |
          folder=$(uv run treasure-island run configs/silent.toml --seed 7 --no-watch)
          uv run treasure-island render "$folder" --out game.gif
          echo "ending=$(tail -n 1 "$folder/story.txt")" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          path: game.gif
          archive: false

  comment:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: show the games
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          GIF_URL: ${{ needs.render.outputs.gif-url }}
          ENDING: ${{ needs.render.outputs.ending }}
        run: |
          # The marker finds this workflow's own comment, so it never edits a
          # comment that another workflow keeps on the same pull request.
          marker="<!-- game-gif -->"
          # Committed examples can show inline, from raw files at this commit. A
          # branch from before there were any has only the fresh game to link.
          names=$(gh api "repos/$REPO/contents/examples?ref=$SHA" \
            --jq '.[] | select(.type == "dir") | .name' 2>/dev/null || true)
          shown=""
          for name in $names; do
            raw="https://raw.githubusercontent.com/$REPO/$SHA/examples/$name"
            ending=$(curl --silent --fail "$raw/story.txt" | tail -n 1)
            shown="$shown
          **$name:** $ending

          ![$name]($raw/game.gif)
          "
          done
          # A result this pull request adds or changes shows what it found, how each
          # of its games ended and its GIF.
          results=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' \
            | sed -n 's#^results/\([^/]*\)/.*#\1#p' | sort -u)
          if [ -n "$results" ]; then
            shown="$shown
          **Results in this pull request**
          "
          fi
          for result in $results; do
            raw="https://raw.githubusercontent.com/$REPO/$SHA/results/$result"
            if ! curl --silent --fail --head --output /dev/null "$raw/README.md"; then
              continue
            fi
            found=$(curl --silent --fail "$raw/README.md" \
              | awk '/^## What it shows/ {on = 1; next} /^## / {on = 0} on')
            games=$(gh api "repos/$REPO/contents/results/$result?ref=$SHA" \
              --jq '.[] | select(.type == "dir") | .name')
            endings=""
            for game in $games; do
              ending=$(curl --silent --fail "$raw/$game/story.txt" | tail -n 1)
              endings="$endings
          - \`$game\`: $ending"
            done
            shown="$shown
          ### $result

          $found
          $endings

          ![$result]($raw/game.gif)
          "
          done
          body="$marker
          **The games at ${SHA:0:7}.** [A fresh game, played at this commit]($GIF_URL): $ENDING
          $shown"
          comment=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$comment" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment" \
              --field body="$body" --silent
          else
            gh pr comment "$PR" --repo "$REPO" --body "$body"
          fi
