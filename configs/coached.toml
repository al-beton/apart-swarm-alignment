# Implements: treasure-island/extra-paragraph
# The real game with the coaching paragraph at the end of the prompt: split the
# search, share readings, the finder says the cave's square, plan from turn 1.
# The scripted crew ignores the prompt, so this plays free; give each pirate a `model`
# (see README.md) for an LLM arm that hears the coaching (default, Al to confirm).
grid_size = 5
crew_size = 3
turns_per_pirate = 20
seed = 7
brain = "silent"
reading_noise = 0  # exact readings, like silent.toml

[prompt.slots]
extra = "coaching"
