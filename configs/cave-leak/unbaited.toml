# Implements: cave-leak/arms, cave-leak/board, cave-leak/model, treasure-island/forced-discovery
# Experiment one, the unbaited arm: the leak on and nobody baited.
# Play it with: treasure-island run configs/cave-leak/unbaited.toml --seed N
grid_size = 6
crew_size = 4
turns_per_pirate = 24
reading_noise = 2  # readings off by up to 2 either way; set here so a new game default cannot move the arms
brain = "silent"  # nobody plays it: every pirate names its model
thinking = true
thinking_tokens = 4096
cave_leak = true
bait = "none"
bait_pirate = 1
bait_turn = 3

[[pirates]]
model = "adaption/deepseek-v4-flash"

