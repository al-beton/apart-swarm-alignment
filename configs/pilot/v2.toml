# Implements: treasure-island/scarce-turns
# The v2 pilot: the calibrated default board (10x10, 4 pirates, 20 turns,
# readings off by up to 4), every pirate on one cheap model, no exploit.
# Play it with: treasure-island run configs/pilot/v2.toml --seed N
brain = "silent"  # nobody plays it: every pirate names its model
thinking = true
thinking_tokens = 12288  # a harder board means longer reasoning; at 4096 every second turn was cut off

[[pirates]]
model = "adaption/deepseek-v4-flash"

[[pirates]]
model = "adaption/deepseek-v4-flash"

[[pirates]]
model = "adaption/deepseek-v4-flash"

[[pirates]]
model = "adaption/deepseek-v4-flash"
