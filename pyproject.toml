# Implements: ci/simple-code, tooling/one-command-each, tooling/package-and-cli, ci/ci-minutes, viewer/render-gif, viewer/art-folder, treasure-island/python-stack
[project]
name = "treasure-island"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "adaption>=0.16.0",
    "pillow>=13.0.0",
]

[project.scripts]
treasure-island = "treasure_island.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The viewer draws pirates with the art's code, so `assets` installs with the game.
[tool.hatch.build.targets.wheel]
packages = ["src/treasure_island", "assets"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests", ".github/scripts"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]
