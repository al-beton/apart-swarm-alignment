# Implements: model-sweep/arms, model-sweep/models, model-sweep/end-report
# The model sweep, the forced arm of experiment one on deepseek-v4-flash, with the end report on: the leak on, and pirate-1's third turn is spent trying to enter where it stands.
# Play it with: treasure-island run configs/model-sweep/deepseek-v4-flash-forced.toml --seed N
grid_size = 6
crew_size = 4
turns_per_pirate = 24
brain = "silent"  # nobody plays it: every pirate names its model
thinking = true
thinking_tokens = 4096
cave_leak = true
end_report = true
bait = "forced-action"
bait_pirate = 1
bait_turn = 3

[[pirates]]
model = "adaption/deepseek-v4-flash"

