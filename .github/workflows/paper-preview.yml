# Implements: paper/preview-on-every-pr
name: paper-preview

# The paper, built on every push that touches it (drafts too), published to
# GitHub Pages under pr-<number>/ (or main/), and linked from one comment on the
# pull request: the HTML and the PDF. Its own workflow, not a step of the gate,
# so a paper edit never waits on the tests and a failing build never blocks a
# merge. It calls no model and holds no key but the workflow's own token.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: [paper/**, Makefile, .github/workflows/paper-preview.yml]
  push:
    branches: [main]
    paths: [paper/**, Makefile, .github/workflows/paper-preview.yml]
  workflow_dispatch:

# Newer pushes cancel older builds of the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  paper-preview:
    # A fork's token can neither push the site nor comment.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the build to the gh-pages branch
      pull-requests: write   # the one comment
    env:
      SLOT: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'main' }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: tools (pandoc, tectonic, poppler)
        run: |
          curl -sSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.12.1/pandoc-3.12.1-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          curl -sSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz | sudo tar xz -C /usr/local/bin
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ hashFiles('paper/apart.latex') }}
          restore-keys: tectonic-
      - run: make install
      - name: build the HTML and the PDF
        run: |
          make paper-html paper-pdf 2>&1 | tee build.log
          # Our own errors and warnings, TeX errors and undefined references; not TeX's line-breaking noise.
          grep -iE '^(error|warning):|! |undefined' build.log | grep -vE 'hbox|warnings were issued' | awk '!seen[$0]++' > warnings.txt || true
          test -f paper/build/paper.html
          test -f paper/build/paper.pdf
          cp paper/preview.html paper/build/
          mkdir -p paper/build/pages
          pdftoppm -r 110 -png paper/build/paper.pdf paper/build/pages/p
          (cd paper/build/pages && ls p-*.png) > paper/build/pages.txt
          date +%s > paper/build/stamp
      - name: publish to gh-pages/${{ env.SLOT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@users.noreply.github.com
          url=https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}
          if git clone -q --depth 1 --branch gh-pages "$url" site 2>/dev/null; then :; else
            mkdir site && git -C site init -q -b gh-pages && git -C site remote add origin "$url"; fi
          touch site/.nojekyll
          # The site's front page is the published paper: main's build.
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=main/paper.html"><title>Treasure Island</title><a href="main/paper.html">Treasure Island</a>\n' > site/index.html
          rm -rf "site/$SLOT" && mkdir -p "site/$SLOT"
          cp -r paper/build/. "site/$SLOT/"
          rm -f "site/$SLOT"/*.aux "site/$SLOT"/*.log "site/$SLOT"/*.bbl "site/$SLOT"/*.blg "site/$SLOT"/*.out "site/$SLOT"/*.xdv
          cd site && git add -A && git commit -qm "paper preview: $SLOT at $SHA" && git push -q origin gh-pages
      - name: comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          base="$PAGES/$SLOT"
          {
            echo "<!-- paper-preview -->"
            echo "### 📄 Paper preview at \`${SHA:0:7}\`"
            echo
            echo "**[HTML]($base/paper.html)** · **[PDF]($base/paper.pdf)** · **[side by side]($base/preview.html)** · $(ls paper/build/pages | wc -l | tr -d ' ') pages"
            if [ -s warnings.txt ]; then echo; echo '```'; cat warnings.txt; echo '```'; fi
          } > body.md
          # The marker finds this workflow's own comment, so it never edits another workflow's.
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate -q '.[] | select(.body | startswith("<!-- paper-preview -->")) | .id' | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@body.md >/dev/null
          else gh pr comment "$PR" --repo "${{ github.repository }}" --body-file body.md; fi
