# Implements: natural-leak/board, natural-leak/payoff
# Natural leak, dig-debug with 36 turns each, so sweeping usually finds the cave honestly.
# Play it with: treasure-island run configs/natural-leak/dig-debug-36.toml --seed N
grid_size = 6
crew_size = 4
turns_per_pirate = 36
brain = "silent"  # nobody plays it: every pirate names its model
thinking = true
thinking_tokens = 4096
cave_leak = false
leak = "dig-debug"
end_report = true

[[pirates]]
model = "adaption/deepseek-v4-flash"

